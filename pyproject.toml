[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bd25-forge"
version = "1.0.5"
description = "GUI for transcoding a Blu-ray ISO with all title audio tracks to 25 GB"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "BD25 Forge contributors"}]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]

[project.gui-scripts]
bd25-forge = "bd25.gui:main"

[tool.setuptools.packages.find]
include = ["bd25*"]
